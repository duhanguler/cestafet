version: 2
project_name: cestafet
builds:
  - main: ./cmd/cestafet
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
homebrew_casks:
  - name: cestafet
    description: "Notices between AI coding sessions on one machine, across Claude Code profiles"
    homepage: https://github.com/orkono/cestafet
    license: Apache-2.0
    repository:
      owner: orkono
      name: homebrew-tap
      # GoReleaser accepts only a bare `{{ .Env.NAME }}` here (no functions). The release
      # workflow always sets the variable, empty when the secret is missing.
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    # Without the token (forks, local runs), releases skip the tap instead of failing.
    skip_upload: '{{ if not (index .Env "HOMEBREW_TAP_TOKEN") }}true{{ end }}'
    caveats: |
      Next: run `cestafet setup` to install the Claude Code plugin into your profiles.
      If macOS blocks the unsigned binary, run:
        xattr -dr com.apple.quarantine "$(brew --prefix)/bin/cestafet"
