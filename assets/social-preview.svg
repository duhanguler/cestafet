<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#17143A"/>
  <svg x="96" y="180" width="280" height="280" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1B4D"/>
      <stop offset="1" stop-color="#3B2F8F"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="baton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- the "c": an open ring, 50°..310°, opening to the right -->
  <path d="M 352.4 141.1 A 150 150 0 1 0 352.4 370.9"
        fill="none" stroke="url(#arc)" stroke-width="58" stroke-linecap="round"/>

  <!-- the baton, handed from inside the c out through its opening -->
  <g transform="rotate(-28 340 262)">
    <rect x="236" y="236" width="212" height="52" rx="26" fill="url(#baton)"/>
    <rect x="258" y="246" width="168" height="9" rx="4.5" fill="#FFFFFF" opacity="0.45"/>
  </g>
  </svg>
  <text x="440" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="#FFFFFF">cestafet</text>
  <text x="444" y="372"  font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#C7C9F5">Your AI coding sessions, aware of each other.</text>
  <text x="444" y="425" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#8E90C9">Notices across Claude Code profiles · local · one Go binary</text>
</svg>
